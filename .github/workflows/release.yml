on:
  push:
    tags:
      - "v*"

name: Release extension

permissions:
  contents: write

jobs:
  build:
    name: Release extension (Ubuntu 22.04 / JDK 8 / Node 20)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Use JDK 8 for the pinned Gradle 4.9 build
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - name: Make the Venus Gradle wrapper executable
        shell: bash
        run: chmod +x src/runtime/venus/gradlew
      - name: Install dependencies
        run: npm ci
      - name: Apply binary-safe native host file I/O patches
        shell: pwsh
        run: |
          ./test/native/apply-host-file-io-patches.ps1 -Check
          ./test/native/apply-host-file-io-patches.ps1
      - name: Build Venus core and extension bundle
        run: npm run compileAll
      - name: Build extension
        run: npm run compile
      - name: Verify native Project 2 host file I/O
        run: node test/native/host-file-io.test.js
        env:
          VENUS_REQUIRE_HOST_FILE_IO: '1'
      - name: Package extension
        run: npm run package
      - name: prepare version string
        id: prep_version
        run: |
          export test_version=$(echo ${{ github.ref_name }} |  sed 's/v//g')
          export is_prerelease=$(if [[ $test_version == *"-"* ]]; then echo "true"; else echo "false"; fi)
          echo "version=$test_version" >> "$GITHUB_ENV"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_ENV"
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ env.version }}
          draft: false
          prerelease: ${{ env.is_prerelease }}
          files: '*.vsix'
      - name: Vscode release plugin
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          PUBLISHER_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}
        run: |
          npm run publish -- -p ${{ secrets.PUBLISHER_TOKEN }}
      - name: Publish to Open VSX Registry
        if: ${{ !contains(github.ref_name, '-') }}
        uses: HaaLeo/publish-vscode-extension@v1
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
