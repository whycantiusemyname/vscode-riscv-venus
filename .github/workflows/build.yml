name: Windows build and acceptance

on:
  push:
    branches:
      - codex/cs61c-native-venus
      - codex/venus-parity-integration
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep the extension host identical to ci.yml so a green Windows run means
  # the same thing as a green Linux run instead of tracking "latest".
  VSCODE_TEST_VERSION: '1.85.2'

jobs:
  windows-build-and-accept:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source and Venus core
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Use JDK 8 for the pinned Gradle 4.9 build
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Apply binary-safe native host file I/O patches
        shell: pwsh
        run: |
          ./test/native/apply-host-file-io-patches.ps1 -Check
          ./test/native/apply-host-file-io-patches.ps1

      - name: Build Venus core and extension bundle
        run: npm run compileAll

      - name: Type-check extension and acceptance tests
        run: npm run compile

      - name: Verify the debugger host file I/O wiring
        run: node test/native/host-file-io-wiring.test.js

      - name: Verify native Project 2 host file I/O
        shell: pwsh
        run: |
          $env:VENUS_REQUIRE_HOST_FILE_IO = '1'
          node test/native/host-file-io.test.js

      - name: Run headless CS61C course parity tests
        run: npm run test:course

      - name: Download and verify the pinned CS61C course Venus JAR
        shell: pwsh
        run: |
          $jar = Join-Path $env:RUNNER_TEMP 'venus-fa24.jar'
          Invoke-WebRequest -Uri 'https://inst.eecs.berkeley.edu/~cs61c/su24/tools/venus-latest.jar' -OutFile $jar
          $expected = '69e48a8ffecb155d1227d171ae6888be0d3e103975d04b19762a08fc9463e1cc'
          $actual = (Get-FileHash -LiteralPath $jar -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Pinned course Venus JAR hash mismatch: $actual" }
          "VENUS_COURSE_JAR=$jar" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Differential acceptance against the pinned course venus.jar
        shell: pwsh
        run: |
          $env:VENUS_COURSE_REQUIRE = '1'
          npm run test:course-parity

      - name: Download the Windows VS Code test host
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'vscode-win32-x64.zip'
          $installDir = Join-Path $env:RUNNER_TEMP 'vscode-win32-x64'
          Invoke-WebRequest -Uri "https://update.code.visualstudio.com/${env:VSCODE_TEST_VERSION}/win32-x64-archive/stable" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $installDir
          $codePath = Join-Path $installDir 'Code.exe'
          if (-not (Test-Path -LiteralPath $codePath)) { throw 'The VS Code test host archive is invalid.' }
          "VSCODE_EXECUTABLE_PATH=$codePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run real VS Code extension-host acceptance tests
        run: npm test

      - name: Package VSIX
        run: npm run package

      - name: Upload Windows-built VSIX
        uses: actions/upload-artifact@v5
        with:
          name: cs61c-riscv-venus-windows-${{ github.sha }}
          path: '*.vsix'
          if-no-files-found: error

      - name: Upload VS Code test logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: vscode-windows-test-logs-${{ github.sha }}
          path: |
            .vscode-test/**/logs/**
            mock-debug.txt
          if-no-files-found: ignore
