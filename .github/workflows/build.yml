name: Windows build and acceptance

on:
  push:
    branches: ['codex/cs61c-native-venus']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build-and-accept:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source and Venus core
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Use JDK 8 for the pinned Gradle 4.9 build
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build Venus core and extension bundle
        run: npm run compileAll

      - name: Type-check extension and acceptance tests
        run: npm run compile

      - name: Locate the runner's preinstalled VS Code
        shell: pwsh
        run: |
          $candidates = @(
            'C:\Program Files\Microsoft VS Code\Code.exe',
            'C:\Program Files (x86)\Microsoft VS Code\Code.exe'
          )
          $codePath = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $codePath) { throw 'The Windows runner does not contain a VS Code installation.' }
          "VSCODE_EXECUTABLE_PATH=$codePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run real VS Code extension-host acceptance tests
        run: npm test

      - name: Package VSIX
        run: npm run package

      - name: Upload Windows-built VSIX
        uses: actions/upload-artifact@v5
        with:
          name: cs61c-riscv-venus-windows-${{ github.sha }}
          path: '*.vsix'
          if-no-files-found: error

      - name: Upload VS Code test logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: vscode-windows-test-logs-${{ github.sha }}
          path: |
            .vscode-test/**/logs/**
            mock-debug.txt
          if-no-files-found: ignore
